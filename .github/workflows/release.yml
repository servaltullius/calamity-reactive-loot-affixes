name: release

# Publishes the built artifacts to a GitHub Release so users have a download
# that is not "clone the repo". Data/ stays tracked, so the clone-and-play
# workflow is unaffected -- this only adds a distribution path.
#
# Tagging publishes. The release goes out on the tag push rather than waiting in
# a draft for someone to click publish -- every release here is a public test
# build, so the extra step only delayed the download without adding a decision.
# Pre-release tags (`-rc`) are still marked as pre-releases.
#
# The gate is therefore the tag, not the draft. Everything a release asserts is
# checked before the artifacts are built: the tag must agree with the version
# compiled into the DLL, and both vendored pins must hold.
#
# Papyrus on a runner: a runner has no PapyrusCompiler.exe (it ships with the
# Creation Kit and cannot be installed here), so build_mo2_zip.sh packages the
# .pex committed under Data/Scripts/ instead of compiling them. That is gated on
# tools/verify_papyrus_pin.py, which proves those .pex still match the .psc,
# stubs, and flags file they were built from. A forgotten recompile fails the
# release rather than shipping a stale script.
#
# workflow_dispatch stays enabled as a dry run: it builds and verifies
# everything but creates no release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v). Dry run: no release is created."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # This repo ships pre-releases as `-rc` tags (23 of them). The plugin
          # version never carries that suffix -- CMake only knows
          # MAJOR.MINOR.PATCH -- so the two are compared and looked up
          # separately. `version` names the package; `base_version` is what the
          # DLL reports.
          base_version="${version%%[-+]*}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" == "${base_version}" ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Building version ${version} (declared ${base_version})"

      # Refuse to build a tag that disagrees with what the plugin will actually
      # report to SKSE. Tagging v1.8.0 while CMakeLists.txt still says 1.7.2
      # would otherwise produce a release whose DLL identifies as the old one.
      - name: Verify tag matches declared version
        run: python3 tools/verify_version_consistency.py --expect "${{ steps.version.outputs.version }}"

      - name: Verify CommonLibSSE-NG pin
        run: python3 tools/verify_commonlib_pin.py

      # Packaging will reuse the committed .pex, so fail here rather than after
      # a full cross-compile if they no longer match their sources.
      - name: Verify Papyrus pin
        run: python3 tools/verify_papyrus_pin.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python tool dependencies
        run: python3 -m pip install --upgrade pip jsonschema

      - name: Verify Prisma view structure
        run: python3 tools/verify_prisma_view.py

      - name: Verify runtime contract snapshot sync
        run: python3 tools/verify_runtime_contract_sync.py

      # Same definition ci-verify uses, so a release is built with the exact
      # toolchain the tests ran against.
      - name: Setup cross-build toolchain
        uses: ./.github/actions/setup-cross-build

      # Builds the DLL, runs ctest and the Generator tests, packages the MO2
      # zip, verifies its structure, and writes a SHA256 sidecar.
      - name: Run release build pipeline
        run: python3 tools/release_build.py --version "${{ steps.version.outputs.version }}"

      # Run the full tools suite after the DLL exists so its real packaging
      # E2E tests cannot silently skip on a clean tag runner.
      - name: Run tools workflow tests
        env:
          CALAMITY_REQUIRE_NODE: "1"
          CALAMITY_REQUIRE_PACKAGING_E2E: "1"
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          zip_path="$(ls -t dist/CalamityAffixes_MO2_*.zip | head -1)"
          echo "Packaged: ${zip_path}"
          cp "${zip_path}" "${zip_path}.sha256" release-artifacts/

          # Pull the standalone DLL and ESP out of the zip rather than out of
          # Data/. build_mo2_zip.sh stages a freshly built DLL into the package,
          # but nothing copies it back into the working tree -- reading Data/
          # here would attach the DLL committed at this tag while the zip
          # carried the newly built one, and the two would silently disagree.
          unzip -j -o "${zip_path}" \
            'CalamityAffixes/SKSE/Plugins/CalamityAffixes.dll' \
            'CalamityAffixes/CalamityAffixes.esp' \
            -d release-artifacts/

          test -f release-artifacts/CalamityAffixes.dll
          test -f release-artifacts/CalamityAffixes.esp
          ls -la release-artifacts/

      # Keep the build output reachable even on a dry run, where no release is
      # created.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calamity-affixes-${{ steps.version.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A locally published release can race its tag push into this job. Do
          # not overwrite it, but do not accept it blindly either: it must be
          # the same public release this run would have created, down to all
          # four asset bytes and the commit reached by the tag.
          verify_status=0
          python3 tools/verify_existing_release.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --artifacts release-artifacts \
            --expected-commit "${GITHUB_SHA}" \
            --expected-prerelease "${{ steps.version.outputs.prerelease }}" \
            || verify_status=$?
          if [[ "${verify_status}" -eq 0 ]]; then
            echo "The existing release is byte-for-byte identical; leaving it untouched."
            exit 0
          fi
          if [[ "${verify_status}" -ne 3 ]]; then
            echo "Existing release verification failed; refusing to create or overwrite anything." >&2
            exit "${verify_status}"
          fi

          # Try rc-specific notes first, then the base release's. An rc usually
          # reuses the notes written for the version it is a candidate for, but
          # allowing an exact match means a candidate CAN carry its own.
          # `|| true`: with `set -e` a no-match grep inside the substitution
          # would abort the step, and "no prepared notes" is a normal case.
          notes_file=""
          for candidate in "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.base_version }}"; do
            name="$(ls docs/releases | grep -- "-v${candidate}\.md$" | tail -1 || true)"
            if [[ -n "$name" && -f "docs/releases/${name}" ]]; then
              notes_file="docs/releases/${name}"
              break
            fi
          done

          if [[ -n "$notes_file" ]]; then
            echo "Using release notes: $notes_file"
            notes_arg=(--notes-file "$notes_file")
          else
            echo "No prepared notes for v${{ steps.version.outputs.version }}; generating from commits"
            notes_arg=(--generate-notes)
          fi

          # Deliberately empty by default: the tag is the decision to release,
          # so the artifacts go public with it rather than waiting in a draft.
          # `-rc` tags stay marked as pre-releases, which is what keeps them
          # off the "Latest release" badge.
          release_arg=()
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            release_arg+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            "${release_arg[@]}" \
            --title "Calamity - Reactive Loot & Affixes ${GITHUB_REF_NAME}" \
            "${notes_arg[@]}" \
            release-artifacts/*
