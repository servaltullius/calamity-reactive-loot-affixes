name: ci-verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affix-lint:
    name: Affix lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python lint dependencies
        run: python3 -m pip install --upgrade pip jsonschema

      - name: Verify composed spec is up-to-date
        run: python3 tools/compose_affixes.py --check

      - name: Lint affix spec and generated snapshot
        run: python3 tools/lint_affixes.py --spec affixes/affixes.json --generated Data/SKSE/Plugins/CalamityAffixes/affixes.json

      # CMakeLists.txt is authoritative; vcpkg.json sat eleven releases behind
      # it because nothing read that field at build time.
      - name: Verify declared versions agree
        run: python3 tools/verify_version_consistency.py

      # The vendored CommonLibSSE-NG tree must still match its recorded pin.
      - name: Verify CommonLibSSE-NG pin
        run: python3 tools/verify_commonlib_pin.py

      # A runner has no Papyrus compiler, so a release packages the committed
      # .pex. Check here that they still match their .psc -- otherwise the first
      # sign of a forgotten recompile would be a shipped, stale script.
      - name: Verify Papyrus pin
        run: python3 tools/verify_papyrus_pin.py

  generator-tests:
    name: Generator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run generator tests
        run: dotnet test tools/CalamityAffixes.Generator.Tests/CalamityAffixes.Generator.Tests.csproj -c Release --nologo

  tools-workflow-tests:
    name: Tools workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Two Prisma behaviour tests shell out to node. Without this they call
      # skipTest() and the job reports success having never run them.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python tool dependencies
        run: python3 -m pip install --upgrade pip jsonschema

      - name: Run tools workflow tests
        # CALAMITY_REQUIRE_NODE turns a missing node from a silent skip into a
        # failure, so this job cannot go green with those tests unexecuted.
        env:
          CALAMITY_REQUIRE_NODE: "1"
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Verify runtime contract snapshot sync
        run: python3 tools/verify_runtime_contract_sync.py

  runtime-gate-tests:
    name: Runtime gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Shared with the release workflow so a release can never be built
      # against a different toolchain than the one CI tested.
      - name: Setup cross-build toolchain
        uses: ./.github/actions/setup-cross-build

      - name: Configure SKSE and runtime gates
        run: python3 tools/ensure_skse_build.py --lane plugin --lane runtime-gate

      - name: Build SKSE static checks
        run: cmake --build skse/CalamityAffixes/build.linux-clangcl-rel --target CalamityAffixesStaticChecks --parallel

      - name: Build SKSE plugin target
        run: cmake --build skse/CalamityAffixes/build.linux-clangcl-rel --target CalamityAffixes --parallel

      - name: Build runtime gate checks
        run: cmake --build skse/CalamityAffixes/tests/build --parallel

      - name: Execute runtime gate checks
        run: ctest --test-dir skse/CalamityAffixes/tests/build --no-tests=error --output-on-failure
